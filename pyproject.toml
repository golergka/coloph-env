[project]
name = "coloph-env"
version = "0.2.0"
description = "Strict startup environment configuration for Python"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["coloph-install-skills==0.1.3", "python-dotenv>=1.2,<2"]

[project.urls]
Repository = "https://github.com/golergka/coloph-env"
Issues = "https://github.com/golergka/coloph-env/issues"

[project.scripts]
coloph-env = "coloph_env.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coloph_env"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src"]
